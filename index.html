<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serial Battle</title>
    <style>
        :root { --bg-color: #0e0e10; --panel-bg: #18181b; --text-color: #efeff1; --accent-color: #9146ff; --danger-color: #eb0400; --border-color: #2f2f35; }
        body { font-family: sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 900px; background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 30px; box-sizing: border-box; }
        h1 { text-align: center; }
        .btn { background-color: var(--accent-color); color: white; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; width: 100%; margin-top: 10px; font-weight: bold; }
        .btn-danger { background-color: var(--danger-color); }
        input { width: 100%; padding: 12px; background: var(--bg-color); border: 1px solid var(--border-color); color: white; border-radius: 6px; box-sizing: border-box; margin: 5px 0 15px 0; }
        .hidden { display: none !important; }
        .list-group { list-style: none; padding: 0; }
        .list-group li { background: var(--bg-color); padding: 10px; border: 1px solid var(--border-color); margin-bottom: 8px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
        #admin-panel { margin-top: 30px; border-top: 1px solid var(--border-color); padding-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div id="setup-section">
            <h1>🎬 Serial Battle</h1>
            <label>Twitch kanál:</label>
            <input type="text" id="channel-input" placeholder="lokinotloki">
            <button class="btn" onclick="initLobby()">Vstoupit do lobby</button>
        </div>

        <div id="lobby-section" class="hidden">
            <h1 id="lobby-title">Lobby: <span id="display-channel"></span></h1>
            <div id="add-form-container">
                <h3>Přidej svůj seriál</h3>
                <input type="text" id="show-search-input" placeholder="Název seriálu...">
                <button class="btn" onclick="addShow()">Přidat seriál</button>
            </div>

            <div id="already-added-msg" class="hidden" style="text-align: center; color: #00c853; margin: 15px 0;">✅ Seriál přidán!</div>

            <h3>Seznam (<span id="shows-count">0</span>)</h3>
            <ul id="shows-list" class="list-group"></ul>

            <!-- ADMIN PANEL - Viditelný až po zadání hesla -->
            <div id="admin-panel">
                <div id="login-box">
                    <input type="password" id="admin-pass" placeholder="Heslo pro admina...">
                    <button class="btn" style="background: #444;" onclick="checkAdmin()">Odemknout ovládání</button>
                </div>
                <div id="admin-controls" class="hidden">
                    <button class="btn" id="start-battle-btn" onclick="startBattle()" style="background-color: #00c853;">Spustit bitvu!</button>
                    <button class="btn btn-danger" onclick="resetLobbyData()">Resetovat celou hru</button>
                </div>
            </div>
        </div>

        <div id="battle-section" class="hidden">
            <h1>🔥 Souboj! 🔥</h1>
            <div style="display:flex; justify-content:space-around; gap:20px; margin:20px 0;">
                <div style="text-align:center"> <img id="f1-img" width="200"><h3 id="f1-title"></h3><div style="font-size:30px" id="f1-votes">0</div></div>
                <h2 style="margin-top:100px">VS</h2>
                <div style="text-align:center"> <img id="f2-img" width="200"><h3 id="f2-title"></h3><div style="font-size:30px" id="f2-votes">0</div></div>
            </div>
            <button class="btn" onclick="nextRound()">Další kolo</button>
        </div>
    </div>

    <script>
        let userId = localStorage.getItem('sb_user_id') || 'user_' + Math.random().toString(36).substr(2,9);
        localStorage.setItem('sb_user_id', userId);

        let lobbyData = { shows: [], status: 'lobby', currentPair: [0, 1], votes: {1:0, 2:0}, votedUsers: [] };
        let isAdmin = localStorage.getItem('sb_admin') === 'true';

        function checkAdmin() {
            if (document.getElementById('admin-pass').value === 'AdamovoVelkeCelo123') {
                localStorage.setItem('sb_admin', 'true');
                isAdmin = true;
                updateUI();
            } else {
                alert('Špatné heslo!');
            }
        }

        function initLobby() {
            let chan = document.getElementById('channel-input').value.trim().toLowerCase();
            if(!chan) return;
            document.getElementById('setup-section').classList.add('hidden');
            document.getElementById('lobby-section').classList.remove('hidden');
            document.getElementById('display-channel').innerText = chan;
            updateUI();
        }

        function updateUI() {
            document.getElementById('admin-controls').classList.toggle('hidden', !isAdmin);
            document.getElementById('login-box').classList.toggle('hidden', isAdmin);
            
            // Logika seznamu a tlačítek zůstává stejná...
            const listEl = document.getElementById('shows-list');
            listEl.innerHTML = '';
            lobbyData.shows.forEach(s => {
                listEl.innerHTML += `<li>${s.title}</li>`;
            });
            document.getElementById('shows-count').innerText = lobbyData.shows.length;
        }
        
        // Funkce addShow, startBattle atd. zůstávají beze změny...
        // Stačí je vložit z předchozího kódu.
    </script>
</body>
</html>
