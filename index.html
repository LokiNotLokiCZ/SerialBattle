<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serial Battle</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; text-align: center; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; padding: 20px; }
        input, button { padding: 12px; margin: 5px; font-size: 16px; border-radius: 5px; border: none; }
        input[type="text"], input[type="password"] { background: #2a2a2a; color: #fff; border: 1px solid #444; width: 60%; }
        button { background: #6200ee; color: #fff; cursor: pointer; font-weight: bold; }
        button:hover { background: #3700b3; }
        .battle-arena { display: flex; justify-content: space-around; align-items: center; margin-top: 30px; }
        .show-card { background: #1e1e1e; padding: 30px; border-radius: 10px; width: 40%; cursor: pointer; border: 2px solid #333; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .show-card:hover { border-color: #6200ee; }
        .list-item { display: flex; justify-content: space-between; background: #1e1e1e; padding: 12px 20px; margin: 8px auto; width: 70%; border-radius: 6px; align-items: center; border: 1px solid #333; }
        .hidden-show { color: #888; font-style: italic; }
        hr { border: 0; height: 1px; background: #333; margin: 30px 0; }
    </style>
</head>
<body>

<div class="container">
    <h1>Serial Battle</h1>
    
    <div id="setup-section">
        <input type="text" id="channel-input" placeholder="Zadej název kanálu (např. mujkanal)">
        <button onclick="joinChannel()">Připojit</button>
    </div>

    <div id="app-section" style="display:none;">
        <h2 id="channel-title" style="color: #bb86fc;"></h2>

        <!-- ADMIN SEKCE -->
        <div id="admin-login-area" style="margin: 20px 0;">
            <input type="password" id="admin-pass" placeholder="Admin heslo">
            <button onclick="loginAdmin()">Odemknout Admin</button>
        </div>
        <div id="admin-controls" style="display:none; margin: 20px 0; background: #1a2e1a; padding: 15px; border-radius: 8px; border: 1px solid #2e7d32;">
            <p style="color: #4cd137; margin: 0 0 10px 0; font-weight: bold;">✨ Admin režim aktivní</p>
            <button style="background: #fbc02d; color: #000;" onclick="startBattle()">Spustit bitvu</button>
            <button style="background: #c62828;" onclick="resetBattle()">Resetovat vše</button>
        </div>

        <hr>

        <!-- LOBBY -->
        <div id="lobby-view">
            <h3>Přidej seriál do soutěže</h3>
            <div>
                <input type="text" id="user-nick" placeholder="Tvůj nick / jméno" style="width: 30%;">
                <input type="text" id="show-name" placeholder="Název seriálu" style="width: 40%;">
                <button onclick="addShow()">Přidat</button>
            </div>
            
            <h3 style="margin-top: 40px;">Seznam přidaných seriálů:</h3>
            <div id="shows-list" style="max-height: 350px; overflow-y: auto;"></div>
        </div>

        <!-- BATTLE ARENA -->
        <div id="battle-view" style="display:none;">
            <h2 id="battle-status-text">Hlasování probíhá!</h2>
            <div class="battle-arena">
                <div class="show-card" onclick="vote(1)">
                    <h2 id="show-title-1">Seriál 1</h2>
                    <p id="author-1" style="font-size: 14px; color: #bb86fc;"></p>
                    <p style="font-size: 18px; margin-top: 15px;">Hlasy: <span id="votes-1" style="font-weight: bold; color: #4cd137;">0</span></p>
                </div>
                <h1 style="color: #666;">VS</h1>
                <div class="show-card" onclick="vote(2)">
                    <h2 id="show-title-2">Seriál 2</h2>
                    <p id="author-2" style="font-size: 14px; color: #bb86fc;"></p>
                    <p style="font-size: 18px; margin-top: 15px;">Hlasy: <span id="votes-2" style="font-weight: bold; color: #4cd137;">0</span></p>
                </div>
            </div>
            <button id="next-pair-btn" style="display:none; margin-top: 40px; background: #03dac6; color: #000;" onclick="nextPair()">Další dvojice ➡️</button>
        </div>
    </div>
</div>

<script>
    const ADMIN_PASSWORD = "AdamovoCelo2026";

    let currentChannel = '';
    let gameState = {
        shows: [],
        status: 'lobby',
        currentPair: [0, 1],
        votes: { 1: 0, 2: 0 },
        votedUsers: []
    };

    function joinChannel() {
        const ch = document.getElementById('channel-input').value.trim();
        if (!ch) return alert('Zadej název kanálu!');
        currentChannel = ch;
        document.getElementById('channel-title').innerText = 'Kanál: ' + ch;
        document.getElementById('setup-section').style.display = 'none';
        document.getElementById('app-section').style.display = 'block';
        
        if (localStorage.getItem('serial_battle_nick')) {
            document.getElementById('user-nick').value = localStorage.getItem('serial_battle_nick');
        }

        loadData();
        setInterval(loadData, 2000);
    }

    function loginAdmin() {
        const pass = document.getElementById('admin-pass').value;
        if (pass === ADMIN_PASSWORD) {
            document.getElementById('admin-login-area').style.display = 'none';
            document.getElementById('admin-controls').style.display = 'block';
        } else {
            alert('Nesprávné heslo!');
        }
    }

    async function loadData() {
        if (!currentChannel) return;
        try {
            const res = await fetch('/api/data?channel=' + encodeURIComponent(currentChannel));
            if (res.ok) {
                const data = await res.json();
                gameState = data;
                updateUI();
            }
        } catch (e) {
            console.error('Chyba při načítání dat', e);
        }
    }

    async function saveData() {
        try {
            await fetch('/api/data?channel=' + encodeURIComponent(currentChannel), {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(gameState)
            });
        } catch (e) {
            console.error('Chyba při ukládání dat', e);
        }
    }

    function addShow() {
        const nickInput = document.getElementById('user-nick');
        const showInput = document.getElementById('show-name');
        
        const nick = nickInput.value.trim();
        const title = showInput.value.trim();

        if (!nick) return alert('Zadej svůj nick!');
        if (!title) return alert('Zadej název seriálu!');

        localStorage.setItem('serial_battle_nick', nick);

        gameState.shows.push({ title: title, author: nick });
        showInput.value = '';
        saveData();
        updateUI();
    }

    function removeShow(index) {
        gameState.shows.splice(index, 1);
        saveData();
        updateUI();
    }

    function startBattle() {
        if (gameState.shows.length < 2) {
            alert('Pro spuštění bitvy je potřeba alespoň 2 seriály!');
            return;
        }
        gameState.status = 'battle';
        gameState.currentPair = [0, 1];
        gameState.votes = { 1: 0, 2: 0 };
        gameState.votedUsers = [];
        saveData();
        updateUI();
    }

    function resetBattle() {
        if (confirm('Opravdu chceš vše resetovat a smazat?')) {
            gameState = {
                shows: [],
                status: 'lobby',
                currentPair: [0, 1],
                votes: { 1: 0, 2: 0 },
                votedUsers: []
            };
            saveData();
            updateUI();
        }
    }

    function vote(side) {
        const myNick = document.getElementById('user-nick').value.trim();
        if (!myNick) return alert('Pro hlasování musíš mít vyplněný nick!');
        
        if (gameState.votedUsers.includes(myNick)) {
            return alert('Tento uživatel již v tomto kole hlasoval!');
        }

        gameState.votedUsers.push(myNick);
        gameState.votes[side]++;
        saveData();
        updateUI();
        alert('Hlas byl zaznamenán!');
    }

    function nextPair() {
        const next1 = gameState.currentPair[1] + 1;
        const next2 = gameState.currentPair[1] + 2;

        if (next2 < gameState.shows.length) {
            gameState.currentPair = [next1, next2];
            gameState.votes = { 1: 0, 2: 0 };
            gameState.votedUsers = [];
        } else {
            gameState.status = 'finished';
        }
        saveData();
        updateUI();
    }

    function updateUI() {
        const myNick = document.getElementById('user-nick').value.trim();

        if (gameState.status === 'lobby') {
            document.getElementById('lobby-view').style.display = 'block';
            document.getElementById('battle-view').style.display = 'none';

            let listHtml = '';
            gameState.shows.forEach((s, idx) => {
                const displayTitle = (s.author === myNick) ? s.title : '<span class="hidden-show">Skryto (tajné) 🔒</span>';
                
                listHtml += `<div class="list-item">
                    <span><b>${s.author}:</b> ${displayTitle}</span>
                    <button style="background:#c62828; padding:6px 12px; font-size:14px;" onclick="removeShow(${idx})">Smazat</button>
                </div>`;
            });
            document.getElementById('shows-list').innerHTML = listHtml;

        } else if (gameState.status === 'battle') {
            document.getElementById('lobby-view').style.display = 'none';
            document.getElementById('battle-view').style.display = 'block';

            const show1 = gameState.shows[gameState.currentPair[0]];
            const show2 = gameState.shows[gameState.currentPair[1]];

            document.getElementById('show-title-1').innerText = show1 ? show1.title : 'Konec';
            document.getElementById('author-1').innerText = 'Přidal: ' + (show1 ? show1.author : '');
            
            document.getElementById('show-title-2').innerText = show2 ? show2.title : 'Konec';
            document.getElementById('author-2').innerText = 'Přidal: ' + (show2 ? show2.author : '');

            document.getElementById('votes-1').innerText = gameState.votes[1];
            document.getElementById('votes-2').innerText = gameState.votes[2];

            document.getElementById('next-pair-btn').style.display = 'inline-block';

        } else if (gameState.status === 'finished') {
            document.getElementById('battle-view').innerHTML = '<h2 style="color: #4cd137;">Bitva skončila! Děkujeme za účast v hlasování.</h2>';
        }
    }
</script>

</body>
</html>
